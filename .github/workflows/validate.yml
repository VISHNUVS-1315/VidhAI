name: Validate VidhAI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vidhai-${{ github.ref }}-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Secret and tracked-env guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked local env/credential files
        shell: bash
        run: |
          set -euo pipefail
          bad_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          bad_creds="$(git ls-files | grep -Ei '(^|/)(service-account|credentials|secrets).*\.json$' || true)"
          if [ -n "$bad_env$bad_creds" ]; then
            echo "Sensitive local configuration must not be tracked:"
            printf '%s\n%s\n' "$bad_env" "$bad_creds"
            exit 1
          fi

      - name: Reject obvious provider/private-key secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'gsk_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|GROQ_API_KEY=[^[:space:]#]+|NVIDIA_API_KEY=[^[:space:]#]+|DATA_GOV_API_KEY=[^[:space:]#]+' -- . ':(exclude).github/workflows/validate.yml' ':(exclude)functions/.env.example'; then
            echo "Potential secret found in tracked source."
            exit 1
          fi

  backend:
    name: Backend TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: npm install

      - name: TypeScript build
        run: npm run build

  flutter:
    name: Flutter analyze, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vidhai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Test
        run: flutter test
