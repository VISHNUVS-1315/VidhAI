# Render Blueprint for the VidhAI backend.
#
# VidhAI app text chat uses Groq; crop AI, vision and safety use NVIDIA NIM.
# Live market prices come from data.gov.in / AGMARKNET.
# Firebase remains on the Spark plan for Auth/Firestore; Render verifies
# Firebase ID tokens with FIREBASE_SERVICE_ACCOUNT_JSON.

services:
  - type: web
    name: vidhai-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: functions
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_VERSION
        value: "1.0.0"
      - key: FIREBASE_PROJECT_ID
        value: "vidhai-app"

      # Required secrets — enter values only in Render Environment.
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # Non-secret configuration.
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
      - key: AI_RATE_LIMIT_MAX_REQUESTS
        value: "30"
