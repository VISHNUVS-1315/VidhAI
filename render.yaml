# Render Blueprint for the VidhAI backend.
#
# Secret values are never stored in this file. Add them only in Render's
# Environment dashboard. sync:false prevents Blueprint sync from requiring
# or exposing their values.

services:
  - type: web
    name: vidhai-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: functions
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_VERSION
        value: "1.0.0"
      - key: FIREBASE_PROJECT_ID
        value: "vidhai-app"

      # Required secrets — enter values only in Render Environment.
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # Non-secret security/runtime configuration.
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "60"
      - key: AI_RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "20"
      - key: CORS_ORIGINS
        value: "*"
